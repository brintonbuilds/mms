# Deploys the apme2027/ folder as the site root for the custom domain apme2027.com.
# apme2027.ca redirects to apme2027.com through Cloudflare.
name: Deploy APME 2027 to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['apme2027/**', '.github/workflows/pages-apme2027.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apme2027
      - id: deployment
        uses: actions/deploy-pages@v4
